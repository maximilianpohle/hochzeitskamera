services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./uploads:/app/uploads

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      - app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
