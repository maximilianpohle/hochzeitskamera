<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hochzeitskamera</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="app-shell">
      <section class="camera-card">
        <div id="uploadBanner" class="upload-banner" hidden></div>
        <video id="preview" autoplay playsinline muted></video>
        <canvas id="snapshot" hidden></canvas>
        <input id="cameraFileInput" type="file" accept="image/*" capture="environment" hidden />
        <input id="fallbackFileInput" type="file" accept="image/*" hidden />

        <div class="controls">
          <button id="switchCameraBtn" type="button">Front/Rückkamera wechseln</button>
          <button id="captureBtn" type="button" class="primary">Foto aufnehmen</button>
          <button id="fallbackUploadBtn" type="button">Foto via Kamera/Galerie wählen</button>
        </div>
      </section>
    </main>

    <div class="toast-wrap" aria-live="polite" aria-atomic="true">
      <div id="statusToast" class="toast" hidden></div>
    </div>

    <div class="app-version" aria-label="Versionsnummer">v{{ app_version }}</div>

    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
