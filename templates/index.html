<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hochzeitskamera</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <h1>Hochzeitskamera</h1>
        <p>Foto machen und direkt auf den Server speichern</p>
      </header>

      <section class="camera-card">
        <video id="preview" autoplay playsinline muted></video>
        <canvas id="snapshot" hidden></canvas>
        <input id="fallbackFileInput" type="file" accept="image/*" capture="environment" hidden />

        <div class="controls">
          <button id="switchCameraBtn" type="button">Front/Rückkamera wechseln</button>
          <button id="captureBtn" type="button" class="primary">Foto aufnehmen</button>
          <button id="fallbackUploadBtn" type="button" hidden>Foto via Kamera/Galerie wählen</button>
        </div>

        <p id="status" class="status">Kamera wird vorbereitet...</p>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
